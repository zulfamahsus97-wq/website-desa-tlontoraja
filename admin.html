
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Admin | Desa Tlontoraja</title>

    <link rel="stylesheet" href="admin.css">
</head>

<body>

    <main class="login-container">

        <div class="login-card">

            <h1>DESA TLONTORAJA</h1>

            <p class="login-subtitle">
                PANEL ADMINISTRATOR
            </p>

            <h2>Login Admin</h2>

            <p>
                Silakan masuk untuk mengelola pelayanan desa.
            </p>

            <form id="adminLoginForm">

                <div class="form-group">
                    <label for="adminEmail">
                        Email Admin
                    </label>

                    <input
                        type="email"
                        id="adminEmail"
                        placeholder="Masukkan email admin"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="adminPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="adminPassword"
                        placeholder="Masukkan password"
                        required
                    >
                </div>

                <button type="submit" id="loginButton">
                    Masuk ke Dashboard
                </button>

                <p id="loginMessage"></p>
<button type="button" id="forgotPasswordButton">
    Lupa Password?
</button>

            </form>

            <a href="index.html">
                Kembali ke Website Desa
            </a>

        </div>

    </main>

    <script type="module" src="admin.js"></script>

</body>
</html>
